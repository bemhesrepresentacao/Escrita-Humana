<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Texto para Escrita à Mão</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #2c3e50;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .controls label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .controls input[type="range"] {
      flex: 1;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 1.5rem;
      outline: none;
    }

    textarea:focus {
      border-color: #3498db;
    }

    .output-box {
      background-color: #fffde7;
      border: 1px solid #f0e68c;
      border-radius: 8px;
      padding: 1.5rem;
      min-height: 150px;
      word-wrap: break-word;
      
      /* Aplicação da fonte manuscrita */
      font-family: 'Sacramento', cursive;
      font-size: 32px;
      line-height: 1.4;
      color: #1a237e;
    }

    .btn-copy {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>

    <h1>Conversor para Escrita à Mão</h1>

    <textarea id="inputText" placeholder="Digite seu texto aqui..."></textarea>

    <div class="controls">
      <label for="fontSize">Tamanho da Fonte:</label>
      <input type="range" id="fontSize" min="20" max="60" value="32">
      <span id="sizeValue">32px</span>
    </div>

    <div id="outputText" class="output-box">O seu texto aparecerá aqui...</div>

    <button class="btn-copy" onclick="copiarTexto()">Copiar Texto</button>
  </div>
