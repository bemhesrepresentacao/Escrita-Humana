<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor para Escrita à Mão</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .output-box {
      background-color: #fffde7;
      border: 1px solid #f0e68c;
      border-radius: 8px;
      padding: 1.5rem;
      min-height: 150px;
      word-break: break-word;
      
      /* Fonte Manuscrita (Caveat costuma ser mais legível) */
      font-family: 'Caveat', cursive;
      font-size: 36px;
      color: #1a237e;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.8rem;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="margin-bottom: 1rem; text-align: center;">Gerador de Escrita à Mão</h2>

    <textarea id="inputText" placeholder="Digite seu texto aqui..."></textarea>

    <div id="outputText" class="output-box">O seu texto aparecerá aqui...</div>

    <button onclick="baixarImagem()">Baixar como Imagem (PNG)</button>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');

    inputText.addEventListener('input', () => {
      const text = inputText.value;
      outputText.innerText = text.trim() === '' ? 'O seu texto aparecerá aqui...' : text;
    });

    function baixarImagem() {
      const areaTexto = document.getElementById('outputText');
      
      html2canvas(areaTexto).then(canvas => {
        const link = document.createElement('a');
        link.download = 'texto-manuscrito.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>

</body>
</html>
